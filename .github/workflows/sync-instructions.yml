name: 指示ファイルの同期チェック

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# job の id はそのまま required status check の名前になる。
# 設定コマンドに渡しやすいよう ASCII のまま維持し、日本語の name: は付けない。
jobs:
  sync-instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 2 ファイルが byte-identical であることを確認
        run: |
          if cmp -s AGENTS.md .github/copilot-instructions.md; then
            echo "一致を確認しました。"
            exit 0
          fi
          echo "::error::AGENTS.md と .github/copilot-instructions.md の内容が一致しません。"
          echo "両ファイルは byte-identical に保つ必要があります。"
          echo "理由は docs/adr/0001-duplicate-instruction-files.md を参照してください。"
          echo "--- diff ---"
          diff AGENTS.md .github/copilot-instructions.md || true
          exit 1
